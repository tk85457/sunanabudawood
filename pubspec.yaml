name: sunan_abu_dawood
description: "Sunan Abu Dawood – All Languages - Production Hadith App"
publish_to: 'none'
version: 1.1.7+9

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_riverpod: ^2.5.1
  go_router: ^17.1.0
  google_fonts: ^8.0.2
  google_mobile_ads: ^5.3.1
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2
  path: ^1.9.1
  path_provider: ^2.1.5
  screenshot: ^3.0.0
  share_plus: ^12.0.1
  shared_preferences: ^2.5.4
  sqflite: ^2.4.2
  shimmer: ^3.0.0
  sqflite_common_ffi: ^2.4.0+2
  sqflite_common_ffi_web: ^1.1.1
  in_app_review: ^2.0.12
  url_launcher: ^6.3.1
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0
  isar_community_generator: ^3.3.2
  build_runner: any
  change_app_package_name: ^1.5.0
  rename_app: ^1.6.5

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon_circle.png"
  min_sdk_android: 21
  adaptive_icon_background: "#00382E"
  adaptive_icon_foreground: "assets/icon/icon_circle.png"

flutter_native_splash:
  color: "#00382E"
  image: assets/icon/icon_circle.png
  android_12:
    image: assets/icon/icon_circle.png
    color: "#00382E"
  web: false

flutter:
  uses-material-design: true
  assets:
    - assets/db/
    - assets/icon/
